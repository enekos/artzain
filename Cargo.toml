[workspace]
resolver = "2"
members = [
    "crates/artzain-core",
    "crates/artzain",
    "crates/artzain-fixture",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/enekos/artzain"
homepage = "https://github.com/enekos/artzain"
authors = ["Eneko Sarasola"]
keywords = ["orchestrator", "supervisor", "process", "systemd", "reconcile"]
categories = ["command-line-utilities", "development-tools", "os::unix-apis"]

[workspace.dependencies]
artzain-core = { path = "crates/artzain-core", version = "1.0.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "signal", "sync", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
