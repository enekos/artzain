[workspace]
resolver = "2"
members = [
    "crates/artzain-core",
    "crates/artzain",
    "crates/artzain-fixture",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/enekos/artzain"
authors = ["Eneko Sarasola"]
keywords = ["orchestrator", "supervisor", "process", "systemd", "reconcile"]
categories = ["command-line-utilities", "development-tools", "os::unix-apis"]

[workspace.dependencies]
artzain-core = { path = "crates/artzain-core", version = "1.0.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "signal", "sync", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_mutex = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
todo = "deny"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
