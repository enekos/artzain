name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary
        run: cargo build --release -p artzain

      - name: Package
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          cp target/release/artzain dist/
          cp README.md dist/
          cd dist
          tar czf "../artzain-${version}-x86_64-unknown-linux-gnu.tar.gz" artzain README.md
          cd ..
          sha256sum "artzain-${version}-x86_64-unknown-linux-gnu.tar.gz" > "artzain-${version}-x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artzain-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: |
            dist/
            artzain-*.tar.gz
            artzain-*.tar.gz.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artzain-*.tar.gz
            artzain-*.tar.gz.sha256
